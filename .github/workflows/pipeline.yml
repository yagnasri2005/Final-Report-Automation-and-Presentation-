name: Daily Sales KPI Pipeline

# Runs the automation pipeline on a schedule, and lets you trigger it manually too.
on:
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 06:00 UTC
  workflow_dispatch: {}     # Allows manual "Run workflow" trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation pipeline
        run: python automation_pipeline.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_data.csv sales_kpi_report.xlsx pipeline.log
          git diff --staged --quiet || git commit -m "Automated pipeline run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
